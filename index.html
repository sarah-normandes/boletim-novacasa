<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Hot Topics · Nova Casa Distribuidora</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Quicksand:wght@600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#4e9e2a; --accent-deep:#3a7d1e; --accent-soft:rgba(78,158,42,0.15);
    --cyan:#3fa9c9; --yellow:#e0a92e; --green:#4e9e2a; --red:#e2543a; --radius:20px;
  }
  [data-theme="dark"]{
    --bg:#14181a; --bg-2:#1a1f21; --card:#1f2528; --card-2:#252c30;
    --line:#323a3d; --ink:#eceae4; --ink-2:#a7b0b2; --ink-3:#79837f;
    --grid-line:rgba(255,255,255,0.02); --shadow:0 10px 30px rgba(0,0,0,0.35); --wordmark:#eceae4;
  }
  [data-theme="light"]{
    --bg:#eef2ec; --bg-2:#e3e9df; --card:#ffffff; --card-2:#f3f7f0;
    --line:#e0e7dd; --ink:#1c2620; --ink-2:#586158; --ink-3:#8f998e;
    --grid-line:rgba(30,45,30,0.025); --shadow:0 10px 28px rgba(40,70,40,0.10); --wordmark:#404040;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ width:100%; height:100%; min-height:100vh; background:var(--bg); }
  body{ font-family:'Inter',sans-serif; }

  #app{
    width:100vw; height:100vh; background:var(--bg);
    background-image:
      radial-gradient(circle at 14% 8%, var(--accent-soft), transparent 42%),
      radial-gradient(circle at 90% 88%, rgba(63,169,201,0.07), transparent 46%),
      repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 52px),
      repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 52px);
    color:var(--ink); display:flex; flex-direction:column;
    transition:background .4s ease, color .4s ease; overflow:hidden;
  }

  header{
    height:118px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:0 46px; background:linear-gradient(180deg, var(--bg-2), var(--bg));
    border-bottom:3px solid var(--accent); position:relative; z-index:5;
  }
  .brand{ display:flex; align-items:center; gap:20px; }
  .brand .logo{ height:64px; width:auto; display:block; }
  [data-theme="dark"] .logo-claro{ display:none; }
  [data-theme="light"] .logo-escuro{ display:none; }
  .brand-divisor{ width:1px; height:44px; background:var(--line); display:block; }
  .brand-sub{ font-family:'JetBrains Mono',monospace; font-weight:500; font-size:13px; letter-spacing:3px; color:var(--ink-3); text-transform:uppercase; white-space:nowrap; }
  .header-right{ display:flex; align-items:center; gap:24px; }
  .tabs{ display:flex; gap:16px; }
  .tab{ display:flex; flex-direction:column; gap:6px; cursor:pointer; }
  .tab .lbl{ font-family:'JetBrains Mono'; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-3); transition:color .25s; white-space:nowrap; }
  .tab.on .lbl{ color:var(--accent); }
  .tab .seg{ width:100%; height:6px; border-radius:6px; background:var(--line); position:relative; overflow:hidden; }
  .tab .seg .prog{ position:absolute; inset:0; width:0; background:var(--accent); border-radius:6px; }
  .tab.on .seg .prog{ animation:fillseg 10s linear infinite; }
  @keyframes fillseg{ from{width:0;} to{width:100%;} }

  .theme-btn{ display:flex; align-items:center; gap:9px; cursor:pointer; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:99px 16px; padding:9px 16px; color:var(--ink-2); font-family:'JetBrains Mono'; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; transition:all .25s ease; }
  .theme-btn:hover{ border-color:var(--accent); color:var(--ink); }
  .theme-btn svg{ width:16px; height:16px; }
  .live-pill{ display:flex; align-items:center; gap:9px; font-family:'JetBrains Mono'; font-size:12px; letter-spacing:2px; color:var(--green); border:1px solid var(--green); border-radius:999px; padding:7px 14px; text-transform:uppercase; }
  .live-dot{ width:8px; height:8px; border-radius:50%; background:var(--green); animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.25;} }
  .clockbox{ text-align:right; min-width:128px; }
  #clock{ font-family:'Oswald'; font-size:36px; font-weight:600; letter-spacing:1px; line-height:1; }
  #dateline{ font-family:'JetBrains Mono'; font-size:12px; color:var(--ink-3); text-transform:capitalize; margin-top:4px; }

  .stage{ flex:1; position:relative; min-height:0; }
  .screen{ position:absolute; inset:0; padding:24px 46px 34px 46px; opacity:0; visibility:hidden; transition:opacity .55s ease; display:grid; gap:18px; overflow-y:auto; }
  .screen.show{ opacity:1; visibility:visible; }
  .screen-title{ grid-column:1 / -1; display:flex; align-items:center; gap:16px; }
  .screen-title .kicker{ font-family:'JetBrains Mono'; font-size:12px; letter-spacing:4px; color:var(--accent); text-transform:uppercase; }
  .screen-title h2{ font-family:'Oswald'; font-weight:600; font-size:25px; text-transform:uppercase; letter-spacing:1px; }
  .screen-title .rule{ flex:1; height:2px; border-radius:2px; background:var(--line); }

  #screen1{ grid-template-columns:1.18fr 1fr 1fr; grid-template-rows:auto 1fr 1fr; }

  .selo{ font-family:'JetBrains Mono'; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-3); border:1px solid var(--line); border-radius:999px; padding:5px 12px; white-space:nowrap; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px 20px 20px; display:flex; flex-direction:column; box-shadow:var(--shadow); transition:background .4s ease, border-color .4s ease; min-height:0; min-width:0; overflow:hidden; }
  .eyebrow{ font-family:'JetBrains Mono'; font-size:10.5px; letter-spacing:1.8px; text-transform:uppercase; color:var(--ink-3); display:flex; justify-content:space-between; align-items:center; margin-bottom:99px; margin-bottom:9px; gap:10px; }
  .eyebrow > span:first-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .eyebrow .tag{ color:var(--accent); background:var(--accent-soft); padding:4px 10px; border-radius:999px; white-space:nowrap; flex-shrink:0; }
  .card h3{ font-family:'Oswald'; font-weight:600; font-size:18px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; line-height:1.15; }
  .figure{ display:flex; align-items:baseline; gap:8px; margin:4px 0 8px 0; flex-wrap:wrap; }
  .figure .num{ font-family:'Oswald'; font-weight:700; font-size:42px; line-height:1; }
  .figure .unit{ font-size:14px; color:var(--ink-2); }
  .desc{ font-size:13.5px; line-height:1.5; color:var(--ink-2); flex:1; overflow:hidden; }

  .card-hero{ grid-column:1; grid-row:2 / span 2; border:1.5px solid var(--accent); }
  .feed{ display:flex; flex-direction:column; gap:11px; overflow-y:auto; flex:1; }
  .feed .item{ display:flex; gap:12px; align-items:flex-start; padding-bottom:10px; border-bottom:1px solid var(--line); }
  .feed .quando{ font-family:'JetBrains Mono'; font-size:9.5px; color:var(--ink-3); flex:0 0 58px; text-transform:uppercase; }
  .feed .txt{ font-size:13px; line-height:1.35; color:var(--ink); }

  footer{ height:70px; flex-shrink:0; background:var(--accent); display:flex; align-items:center; overflow:hidden; position:relative; z-index:5; }
  .ticker-label{ background:var(--bg); color:var(--accent); font-family:'Oswald'; font-weight:700; font-size:17px; text-transform:uppercase; letter-spacing:2px; height:100%; display:flex; align-items:center; padding:0 28px; flex-shrink:0; z-index:2; }
  .ticker-track{ display:flex; white-space:nowrap; animation:scroll 50s linear infinite; }
  .ticker-track span{ font-family:'Inter'; font-weight:600; font-size:18px; color:#fff; padding:0 44px; display:flex; align-items:center; gap:14px; }
  @keyframes scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  /* Responsividade */
  @media (max-width: 1024px) {
    html, body, #app { overflow: auto; height: auto; }
    #screen1 { grid-template-columns: 1fr; grid-template-rows: auto; }
    .card-hero { grid-column: 1; grid-row: auto; }
  }
</style>
<script src="dados.js" onerror="window.__semArquivo=true"></script>
<script>
if(!window.DADOS){
window.DADOS = {
 "atualizado_em": "04/08/2026 16:00",
 "manchetes": [
  {"titulo":"Construção abriu mais de 168 mil vagas no semestre","data":"04/08/2026","fonte":"Anamaco","resumo":"Caged aponta 14.136 novos empregos na construção em junho, alta de 0,46% sobre maio.","destaque":true},
  {"titulo":"Vendas de tintas imobiliárias crescem no semestre","data":"01/08/2026","fonte":"Anamaco","resumo":"Abrafati registra 728,5 milhões de litros nos seis primeiros meses de 2026.","destaque":false}
 ],
 "mensais": {
  "incc": {"valor":"6,40","unidade":"% em 12 meses","ref":"jul/26","fonte":"FGV Ibre"},
  "cimento": {"valor":"38,2M","unidade":"ton no ano","ref":"jan-jul/26","fonte":"SNIC"}
 }
}
}
</script>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <img class="logo logo-escuro" src="img/logo-nova-casa.png" alt="Nova Casa">
      <span class="brand-divisor"></span>
      <span class="brand-sub">Market Intelligence</span>
    </div>
    <div class="header-right">
      <div class="live-pill"><span class="live-dot"></span> Ao Vivo</div>
      <div class="clockbox">
        <div id="clock">00:00:00</div>
        <div id="dateline">--/--/----</div>
      </div>
    </div>
  </header>

  <main class="stage">
    <section id="screen1" class="screen show">
      <div class="screen-title">
        <span class="kicker">Panorama</span>
        <h2>Hot Topics do Setor</h2>
        <span class="rule"></span>
        <span class="selo" id="upd-tag">Atualizado</span>
      </div>

      <div class="card card-hero">
        <div class="eyebrow"><span>Principais Notícias</span> <span class="tag">Anamaco</span></div>
        <h3>Feed de Notícias</h3>
        <div class="feed" id="news-feed"></div>
      </div>

      <div class="card">
        <div class="eyebrow"><span>Indicador</span> <span class="tag">FGV</span></div>
        <h3>INCC</h3>
        <div class="figure">
          <span class="num" id="incc-val">--</span>
          <span class="unit" id="incc-unit">%</span>
        </div>
        <div class="desc">Índice Nacional de Custo da Construção.</div>
      </div>
    </section>
  </main>

  <footer>
    <div class="ticker-label">Destaques</div>
    <div class="ticker-track" id="ticker">
      <span>Carregando dados...</span>
    </div>
  </footer>
</div>

<script>
  // Relógio em tempo real
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').innerText = now.toLocaleTimeString('pt-BR');
    document.getElementById('dateline').innerText = now.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Renderização dos dados
  if (window.DADOS) {
    const data = window.DADOS;
    if (data.atualizado_em) {
      document.getElementById('upd-tag').innerText = 'Atualizado: ' + data.atualizado_em;
    }
    
    // Render Feed de Manchetes
    const feed = document.getElementById('news-feed');
    if (feed && data.manchetes) {
      feed.innerHTML = data.manchetes.map(m => `
        <div class="item">
          <div class="quando"><b>${m.fonte}</b>${m.data}</div>
          <div class="txt">
            <b>${m.titulo}</b>
            <i>${m.resumo}</i>
          </div>
        </div>
      `).join('');
    }

    // Render Indicadores Mensais
    if (data.mensais && data.mensais.incc) {
      document.getElementById('incc-val').innerText = data.mensais.incc.valor;
      document.getElementById('incc-unit').innerText = data.mensais.incc.unidade;
    }

    // Render Ticker de Rodapé
    const ticker = document.getElementById('ticker');
    if (ticker && data.manchetes) {
      const items = data.manchetes.map(m => `<span>${m.titulo}</span>`).join('');
      ticker.innerHTML = items + items; // Duplicado para efeito contínuo de scroll
    }
  }
</script>
</body>
</html>
