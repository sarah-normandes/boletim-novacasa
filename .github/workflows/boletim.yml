name: Boletim Nova Casa

# Quando roda:
on:
  schedule:
    # de 3 em 3 horas em horario comercial (Brasilia = UTC-3)
    # 6h, 9h, 12h, 15h, 18h Brasilia  ->  9,12,15,18,21 UTC
    - cron: '0 9,12,15,18,21 * * 1-6'
  workflow_dispatch:      # permite rodar na mao pelo botao do GitHub
  push:
    branches: [ main ]    # roda tambem a cada alteracao no repositorio

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # necessario para o robo salvar o dados.js

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: pip install requests beautifulsoup4 lxml

      - name: Coletar manchetes e indicadores
        run: python atualizar.py

      - name: Publicar se houver novidade
        run: |
          git config user.name  "Boletim Nova Casa"
          git config user.email "actions@github.com"
          git add dados.js
          if git diff --staged --quiet; then
            echo "Nada novo, nada a publicar."
          else
            git commit -m "Boletim atualizado em $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git push
            echo "dados.js atualizado e publicado."
          fi
