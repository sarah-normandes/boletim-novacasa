name: Boletim Nova Casa
on:
  schedule:
    - cron: '0 9 * * 1-5'
    - cron: '0 16 * * 1-5'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: pip install requests beautifulsoup4 lxml

      - name: Coletar manchetes e indicadores
        run: python atualizar.py

      - name: Publicar se houver novidade
        run: |
          git config user.name "Boletim Nova Casa"
          git config user.email "actions@github.com"
          git add dados.js
          if git diff --staged --quiet; then
            echo "Nada novo hoje, nada a publicar."
          else
            git commit -m "Boletim atualizado em $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git push
            echo "dados.js atualizado e publicado."
          fi
